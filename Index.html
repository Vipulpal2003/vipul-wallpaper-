            color: white;
            outline: none;
            width: 140px;
            font-size: 0.85rem;
        }

        }

            border: none;
            color: white;
            padding: 0.25rem 0.8rem;

            flex-wrap: wrap;
        }

            padding: 1.5rem;

        .card img {

            display: block;
        }

        .info {

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        }

            gap: 0.4rem;

            border-radius: 25px;
            font-size: 0.65rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: 0.2s;

        .apply {
            background: #3e6b9e;
            color: white;
        }

        .download {
            background: #2c5a4c;
            color: white;
        }

        .apply:hover, .download:hover {

            transform: scale(0.96);
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }

        .modal.active {
            visibility: visible;
            opacity: 1;
        }

        .modal-content {

            max-width: 85vw;
            max-height: 85vh;
            overflow: hidden;

        .modal-content img {

            max-height: 60vh;
            display: block;
        }

            gap: 0.8rem;
            padding: 1rem;
            justify-content: center;

            font-weight: 600;
            cursor: pointer;

            color: white;

        .modal-download {
            background: #2c5a4c;
            color: white;
        }

        .modal-close {

            color: white;
        }

        .empty {

            padding: 2.5rem;

            padding: 0.5rem 1.2rem;

    function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function applyWallpaper(url) {
        document.body.style.backgroundImage = `url('${url}')`;
        document.body.style.backgroundSize = 'cover';
        document.body.style.backgroundPosition = 'center';
        document.body.style.backgroundAttachment = 'fixed';
        showToast('✓ Wallpaper applied!');
    }

    async function downloadImage(url, filename) {
        try {
            const response = await fetch(url);
            const blob = await response.blob();
            const blobUrl = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = blobUrl;
            link.download = filename.replace(/[^a-z0-9]/gi, '_').toLowerCase() + '.jpg';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(blobUrl);
            showToast('✓ Downloaded!');
        } catch {
            window.open(url, '_blank');
            showToast('⚠️ Right-click to save');
        }
    }

    function render() {

            if (currentCategory !== 'all' && w.category !== currentCategory) return false;
            if (currentSearch && !w.title.toLowerCase().includes(currentSearch.toLowerCase())) return false;
            return true;
        });

        if (filtered.length === 0) {
            grid.innerHTML = '<div class="empty">✨ No wallpapers found</div>';
            return;
        }

        grid.innerHTML = filtered.map(w => `
            <div class="card" data-id="${w.id}">
                <img src="${w.thumb}" alt="${w.title}" loading="lazy">
                <div class="info">
                    <span class="title">${w.title}</span>
                    <div class="btn-group">
                        <button class="apply" data-id="${w.id}">Apply</button>
                        <button class="download" data-id="${w.id}">Download</button>
                    </div>
                </div>
            </div>
        `).join('');

            const wall = wallpapers.find(w => w.id === id);
            if (!wall) return;

            card.addEventListener('click', (e) => {
                if (e.target.classList.contains('apply') || e.target.classList.contains('download')) return;
                openModal(wall);
            });

            const applyBtn = card.querySelector('.apply');
            applyBtn?.addEventListener('click', (e) => {
                e.stopPropagation();
                applyWallpaper(wall.hd);
            });

            const downloadBtn = card.querySelector('.download');
            downloadBtn?.addEventListener('click', (e) => {
                e.stopPropagation();
                downloadImage(wall.hd, wall.title);
            });
        });
    }

    function openModal(wall) {
        currentWallpaper = wall;
        modalImg.src = wall.hd;
        modal.classList.add('active');
    }
    
    function closeModal() {
        modal.classList.remove('active');
        currentWallpaper = null;
    }

    modalApply.onclick = () => {
        if (currentWallpaper) applyWallpaper(currentWallpaper.hd);
        closeModal();
    };
    modalDownload.onclick = () => {
        if (currentWallpaper) downloadImage(currentWallpaper.hd, currentWallpaper.title);
    };
    modalClose.onclick = closeModal;
    modal.onclick = (e) => { if (e.target === modal) closeModal(); };
    document.onkeydown = (e) => { if (e.key === 'Escape') closeModal(); };

    searchBtn.onclick = () => {
        currentSearch = searchInput.value;
        render();
    };
    searchInput.onkeyup = (e) => {
        if (e.key === 'Enter') {
            currentSearch = searchInput.value;
            render();
        }
    };

    categoryBtns.forEach(btn => {
        btn.onclick = () => {
            categoryBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCategory = btn.dataset.cat;
            render();
        };
    });

    render();
    showToast('🎨 Click Apply to set background | Download to save');
</script>
</body>
</html>
